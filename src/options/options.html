<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fib Ruler Settings</title><link rel="stylesheet" href="options.css"></head><body><main><h1>Fib Ruler</h1><section><h2>Shortcut Settings</h2><label>Draw Shortcut<input id="draw" type="text" value="Shift + A" autocomplete="off"></label><label>Delete Shortcut<input id="delete" type="text" value="Shift + D" autocomplete="off"></label><p id="shortcut-error" role="alert"></p></section><section><h2>Appearance</h2><div id="colors"></div><label>Band Opacity<input id="opacity" type="range" min="0" max="100" step="1"><output id="opacity-value"></output></label><button id="reset" type="button">Reset to TradingView Colors</button></section><p id="saved" role="status"></p></main><script src="options.js"></script></body></html>
